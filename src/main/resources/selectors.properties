# 크롤링 CSS 셀렉터 설정
# 사이트 UI 바뀌면 재빌드 없이 이 파일(또는 실행파일 옆에 같은 이름으로 둔 파일)만 고치면 됨.
# 실행파일과 같은 폴더에 selectors.properties를 두면 여기 값보다 우선 적용됨.

naver.title=#content > div.end_head > h2
naver.score=#content > div.end_head > div.score_area em
naver.tags=#content li.info_lst > ul > li:nth-child(2) > span > a
naver.author=#content li.info_lst > ul > li:nth-child(3) a
naver.description=div#content div.end_dsc div:first-child
naver.list=#content > div.com_srch > div:nth-child(5) > ul > li > div > h3 > a
naver.page=#content > div.com_srch > p > a
# 장르(태그) 검색 결과 페이지는 위와 완전히 다른 템플릿(lst_thum_wrap)을 씀
naver.list.genre=div.lst_thum_wrap li div.cont h3 a
naver.page.genre=p.pagenate a

kakao.title=span.font-large3-bold.mb-3pxr.text-ellipsis.break-all.text-theme-solid-100.line-clamp-2
kakao.score=img[alt='별점'] + span
kakao.tags=div.bg-theme-transparent-10 span.font-small2-bold
kakao.description1=span.font-small1.mb-8pxr.whitespace-pre-wrap
kakao.description2=span.font-small1.mb-8pxr.whitespace-pre-wrap
kakao.author=span.font-small2.mb-6pxr.text-ellipsis.text-theme-solid-100.opacity-70.break-word-anywhere.line-clamp-2
kakao.list=a[href^='/content/']
kakao.name=div.font-small1.line-clamp-2.break-all

pia.title=div.epnew-novel-info > div.ep-info-line.epnew-novel-title
pia.score=div.epnew-novel-info > div.ep-info-line.info-count1 > div.counter-line-a > p:nth-child(2) > span:nth-child(2)
pia.tags=div.epnew-novel-info > div.mobile_hidden > div.ep-info-line.epnew-tag > p.writer-tag span
pia.author=div.epnew-novel-info > div.ep-info-line.epnew-writer > p.in-writer > a
pia.description=div.epnew-novel-info > div.mobile_hidden > div.info-graybox > div.synopsis
pia.list=#search_content > div.rand-lists.list > div.rand-wrapper > div.rand-item-wrapper > div > a
pia.name=#search_content > div.rand-lists.list > div.rand-wrapper > div.rand-item-wrapper > div > a > div > div.item-txt
pia.page=a.page-link
