# 크롤링 CSS 셀렉터 설정
# 사이트 UI 바뀌면 재빌드 없이 이 파일(또는 실행파일 옆에 같은 이름으로 둔 파일)만 고치면 됨.
# 실행파일과 같은 폴더에 selectors.properties를 두면 여기 값보다 우선 적용됨.

naver.title=#content > div.end_head > h2
naver.score=#content > div.end_head > div.score_area em
naver.tags=#content li.info_lst > ul > li:nth-child(2) > span > a
naver.author=#content li.info_lst > ul > li:nth-child(3) a
naver.description=div#content div.end_dsc div:first-child
naver.list=#content > div.com_srch > div:nth-child(5) > ul > li > div > h3 > a
naver.page=#content > div.com_srch > p > a

