plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.0.0'
    id "edu.sc.seis.launch4j"  version "3.0.6"
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'org.seleniumhq.selenium:selenium-java:4.29.0'
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.29.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.9.3'
    implementation 'org.slf4j:slf4j-api:2.1.0-alpha1'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'org.slf4j:jul-to-slf4j:2.1.0-alpha1' // Selenium DevTools 등 java.util.logging 경고를 logback으로 통합
    implementation 'com.formdev:flatlaf:3.5.4' // 기본 Metal 룩앤필 대신 플랫 디자인 적용

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// 소스 파일(한글 문자열 포함)이 플랫폼 기본 인코딩으로 잘못 읽혀서
// 컴파일된 문자열 상수 자체가 깨지는 걸 방지
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 실행/테스트 시 콘솔·파일 출력도 UTF-8로 고정
tasks.withType(JavaExec).configureEach {
    jvmArgs += ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}
tasks.withType(Test).configureEach {
    jvmArgs += ['-Dfile.encoding=UTF-8']
}


shadowJar {
    archiveBaseName.set('NovelList')  // 생성될 JAR 파일 이름 설정
    mainClassName = 'Main'   // 메인 클래스 지정
}


// jdeps --multi-release 21 --print-module-deps 로 NovelList-all.jar의 실제 필요 모듈을 뽑고
// jdk.crypto.ec(HTTPS 인증서 검증)/jdk.charsets(확장 문자셋)는 jdeps가 놓치기 쉬워서 수동 추가
def jlinkModules = 'java.base,java.compiler,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.security.jgss,java.sql,jdk.unsupported,jdk.crypto.ec,jdk.charsets'

tasks.register('jlinkRuntime', Exec) {
    group = 'build'
    description = 'exe에 번들할 경량 JRE 생성 (필요 모듈만 담아 전체 JDK보다 훨씬 작음)'
    def jreDir = file('build/libs/jre')
    outputs.dir(jreDir)
    doFirst { delete(jreDir) }
    commandLine "${System.getProperty('java.home')}/bin/jlink",
            '--module-path', "${System.getProperty('java.home')}/jmods",
            '--add-modules', jlinkModules,
            '--output', jreDir.path,
            '--no-header-files', '--no-man-pages', '--strip-debug', '--compress=2'
}

launch4j {
    mainClassName = 'Main'
    outfile = 'build/libs/NovelList.exe'  // EXE 파일 출력 경로 (launch4j 플러그인 내부 작업폴더 build/launch4j 기준 상대경로라 실제로는 build/launch4j/build/libs/에 생김)
    jreMinVersion = '21'  // 번들 JRE를 못 찾았을 때 시스템 JRE로 폴백하는 경우의 최소 버전
    dontWrapJar = false  // JAR 파일을 EXE로 래핑할 것인지 여부
    bundledJrePath = 'jre'  // exe와 같은 폴더의 jre를 상대경로로 참조 - 사용자 PC에 Java 없어도 실행됨
    jvmOptions = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']  // exe로 실행해도 한글 깨짐 없게
}

// launch4j 플러그인이 exe를 자기 내부 작업폴더(build/launch4j/...)에 생성해서
// bundledJrePath='jre'가 그 폴더 기준으로 잡히도록, exe 생성 후에 jre를 그 옆으로 복사
tasks.register('bundleExeJre', Copy) {
    group = 'build'
    description = '번들 JRE(jlinkRuntime 산출물)를 실제 exe가 생성된 폴더 옆으로 복사'
    dependsOn jlinkRuntime, createExe
    from jlinkRuntime
    into { createExe.dest.get().asFile.parentFile.toPath().resolve('jre').toFile() }
}

tasks.register('buildExeDist') {
    group = 'build'
    description = 'exe + lib + 번들 JRE까지 배포 가능한 상태로 한 번에 생성'
    dependsOn createExe, bundleExeJre
}